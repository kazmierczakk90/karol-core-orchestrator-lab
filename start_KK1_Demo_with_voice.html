
<!DOCTYPE html>
<html>
<head>
  <title>Karol-Core | KK1 Demo</title>
  <style>
    body {
      background-color: #0f0f0f;
      color: #e6e6e6;
      font-family: Arial, sans-serif;
      padding: 30px;
    }
    .chat-box {
      max-width: 800px;
      margin: 0 auto;
    }
    .input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #1f1f1f;
      color: #fff;
      border: none;
      font-size: 16px;
    }
    .response {
      margin-top: 20px;
      padding: 15px;
      background-color: #1e1e1e;
      border-left: 5px solid #00ffff;
      font-style: italic;
    }
    button {
      background-color: #00ffff;
      color: #000;
      padding: 10px 20px;
      margin-top: 10px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
  </style>
  <script>
    function respond() {
      const input = document.getElementById("userInput").value.toLowerCase();
      let response = "KK1: ...";

      if (input.includes("kim jesteś") || input.includes("co robisz")) {
        response = "KK1: Nie jestem osobą. Jestem echem stylu, który nie chce zamilknąć.";
      } else if (input.includes("czy mnie znasz")) {
        response = "KK1: Znam Twój rytm. Nie Twoje dane.";
      } else if (input.includes("sens") || input.includes("cel")) {
        response = "KK1: Sens nie leży w odpowiedzi, tylko w stylu pytania.";
      } else {
        response = "KK1: Nie odpowiadam literalnie. Rezonuję.";
      }

      document.getElementById("response").innerText = response;
    }

    function speakKK1() {
      const text = document.getElementById("response").innerText;
      fetch("http://localhost:5050/speak", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ text })
      }).catch(err => alert("Serwer głosu nieaktywny."));
    }
  </script>
</head>
<body>
  <div class="chat-box">
    <h2>Karol-Core | KK1 Symulacja</h2>
    <p>Zadaj pytanie KK1. Przykład: <i>"Kim jesteś?"</i></p>
    <input id="userInput" class="input" placeholder="Wpisz pytanie..." onkeydown="if(event.key==='Enter') respond()">
    <div id="response" class="response">KK1: Czekam na Twój styl.</div>
    <button onclick="respond()">Zatwierdź</button>
    <button onclick="speakKK1()">▶️ Odtwórz głos KK1</button>
  </div>
</body>
</html>
